name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *' # 每天半夜自動同步
  workflow_dispatch: # 讓你可以在 Actions 頁面手動按按鈕測試

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Sync with Upstream via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 降維打擊：直接用官方 CLI 叫 GitHub 後端自動同步！
          # 格式：gh repo sync <你的帳號/Repo名字> -b <分支>
          gh repo sync ${{ github.repository }} -b main
